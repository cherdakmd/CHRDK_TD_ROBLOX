name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Luau CLI
        run: |
          curl -fsSL -o /tmp/luau.zip https://github.com/luau-lang/luau/releases/download/0.745/luau-ubuntu.zip
          unzip -o /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau
      - name: Test and build
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python tests/run_tests.py --luau /tmp/luau/luau
          python tools/build_place.py
          python tools/render_preview.py
      - name: Package source and checksums
        run: |
          git archive --format=zip --prefix=CHRDK_TD_ROBLOX/ -o release/CHRDK_Rubezh_Source.zip HEAD
          cd release
          sha256sum CHRDK_Rubezh.rbxlx CHRDK_Rubezh_Source.zip > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in v0.*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            release/CHRDK_Rubezh.rbxlx release/CHRDK_Rubezh_Source.zip release/SHA256SUMS.txt \
            --title "РУБЕЖ $GITHUB_REF_NAME" \
            --notes "Автоматическая сборка из исходников. Перед публикацией опыта пройдите docs/STUDIO_CHECKLIST_RU.md. Studio-файл: CHRDK_Rubezh.rbxlx." \
            --verify-tag $PRERELEASE
